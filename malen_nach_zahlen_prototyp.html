em;color:#645c51;text-align:right;flex:1}#message{min-height:23px;font-size:.85rem;color:#4a6f51;margin:6px 0 0;text-align:center}@media(min-width:650px){.art{max-width:510px}.controls{border-radius:18px 18px 0 0}}
</style></head><body><header><h1>🦊 Farbenzauber</h1><p>Fuchs im Blumengarten · Wähle unten eine Farbe und tippe die passende Zahl an.</p><div class="bar"><div class="track"><div id="fill" class="fill"></div></div><span id="percent">0 %</span></div></header><main class="art"><svg id="scene" viewBox="0 0 440 560" role="img" aria-label="Ausmalbild eines Fuchses zwischen Blumen"><defs><pattern id="paper" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".5" fill="#d8d0c2"/></pattern></defs><rect width="440" height="560" fill="url(#paper)"/><path d="M20 470 Q90 445 155 477 T300 474 T420 470" fill="none" stroke="#d3cabb" stroke-width="3"/></svg></main><section class="controls"><div id="palette" class="palette" aria-label="Farbauswahl"></div><div class="actions"><button class="action" id="undo">↶ Zurück</button><button class="action" id="reset">Neu beginnen</button><span id="hint">Tippe auf die nummerierten Flächen</span></div><div id="message" aria-live="polite"></div></section><script>
const colors={1:'#e98c43',2:'#f4bd76',3:'#fff1d5',4:'#795548',5:'#e6a6a9',6:'#f1c954',7:'#89b88c',8:'#5f9572',9:'#94c7e2',10:'#d9b6e5'};
const pieces=[];const svg=document.getElementById('scene');const NS='http://www.w3.org/2000/svg';
function shape(d,n,x,y){pieces.push({d,n,x,y})}
// Layered organic shapes: hills, leaves, petals, ears, tail, body and face.
shape('M0 395 Q70 365 130 390 Q220 340 315 387 Q385 355 440 383 L440 560 L0 560Z',7,74,515);
shape('M0 468 Q105 440 207 478 Q323 438 440 464 L440 560 L0 560Z',8,354,520);
shape('M35 355 Q17 326 33 300 Q57 316 59 349Z',7,40,330);shape('M49 357 Q59 322 87 319 Q84 346 54 364Z',8,70,340);

// flower left
for(let i=0;i<6;i++){let a=i*Math.PI/3;let cx=106+Math.cos(a)*28,cy=385+Math.sin(a)*28;shape(`M106 385 Q${cx-17} ${cy-13} ${cx} ${cy-16} Q${cx+20} ${cy-3} 106 385Z`,i%2?5:10,cx,cy)}shape('M106 373 Q123 373 124 388 Q115 404 101 396 Q92 383 106 373Z',6,109,387);
// flower right
for(let i=0;i<7;i++){let a=i*Math.PI*2/7;let cx=319+Math.cos(a)*29,cy=382+Math.sin(a)*29;shape(`M319 382 Q${cx-17} ${cy-15} ${cx} ${cy-17} Q${cx+19} ${cy-4} 319 382Z`,i%2?3:9,cx,cy)}shape('M319 371 Q336 371 337 386 Q328 401 313 394 Q305 381 319 371Z',6,322,385);
// fox tail behind body
shape('M265 404 Q339 343 379 410 Q402 455 348 475 Q308 490 266 451Z',1,340,427);
shape('M358 387 Q396 415 379 450 Q366 468 336 471 Q355 445 345 420Z',3,372,431);
// fox body
shape('M153 329 Q121 361 130 432 Q142 493 218 498 Q287 497 298 433 Q308 371 269 328Z',1,216,416);
shape('M188 379 Q169 406 176 459 Q190 493 220 495 Q250 491 264 458 Q270 407 246 379 Q220 398 188 379Z',3,219,445);
shape('M148 443 Q125 459 142 482 Q166 497 190 486 Q191 462 171 451Z',4,159,474);
shape('M249 451 Q269 440 291 459 Q307 482 284 490 Q259 497 247 484Z',4,276,473);
// ears
shape('M145 226 Q126 151 144 109 Q191 122 212 183Z',1,164,164);
shape('M151 205 Q143 153 151 134 Q176 150 189 186Z',5,164,174);

// face
shape('M147 207 Q180 173 223 180 Q269 174 299 209 Q320 252 295 311 Q277 355 221 365 Q162 357 143 312 Q119 251 147 207Z',1,222,256);

shape('M246 264 Q257 253 268 264 Q267 276 258 278 Q248 277 246 264Z',4,258,267);

shape('M259 296 Q272 284 285 291 Q283 306 266 307Z',5,272,297);
// small sky elements
shape('M55 138 Q64 116 78 138 Q91 114 99 140 Q95 160 77 172 Q59 159 55 138Z',5,77,145);

let selected=1;let completed=new Set();let history=[];const storage='farbenzauber-fuchs-v1';try{completed=new Set(JSON.parse(localStorage.getItem(storage)||'[]').filter(i=>Number.isInteger(i)&&i>=0&&i<pieces.length))}catch(e){}
const nodes=[];pieces.forEach((p,i)=>{let path=document.createElementNS(NS,'path');path.setAttribute('d',p.d);path.setAttribute('class','piece');path.setAttribute('fill',completed.has(i)?colors[p.n]:'#fffdf7');path.setAttribute('data-i',i);path.addEventListener('click',()=>paint(i));svg.appendChild(path);let num=document.createElementNS(NS,'text');num.setAttribute('x',p.x);num.setAttribute('y',p.y);num.setAttribute('class','num');num.textContent=p.n;svg.appendChild(num);nodes.push({path,num});});
function paint(i){let p=pieces[i];if(completed.has(i))return;if(p.n!==selected){nodes[i].path.classList.remove('wrong');void nodes[i].path.getBoundingClientRect();nodes[i].path.classList.add('wrong');document.getElementById('message').textContent=`Diese Fläche gehört zu Farbe ${p.n}.`;return}completed.add(i);history.push(i);save();render();if(completed.size===pieces.length)document.getElementById('message').textContent='🎉 Geschafft! Dein Fuchs ist fertig ausgemalt.';else document.getElementById('message').textContent='Sehr schön! Weiter so.'}
function save(){try{localStorage.setItem(storage,JSON.stringify([...completed]))}catch(e){}}
function render(){nodes.forEach(({path,num},i)=>{let done=completed.has(i);path.setAttribute('fill',done?colors[pieces[i].n]:'#fffdf7');path.classList.toggle('done',done);num.style.display=done?'none':''});let pct=Math.round(completed.size/pieces.length*100);document.getElementById('fill').style.width=pct+'%';document.getElementById('percent').textContent=pct+' %';const pal=document.getElementById('palette');pal.innerHTML='';Object.entries(colors).forEach(([n,c])=>{let remaining=pieces.filter((p,i)=>p.n===Number(n)&&!completed.has(i)).length;let b=document.createElement('button');b.className='swatch'+(selected===Number(n)?' selected':'')+(remaining===0?' complete':'');b.setAttribute('aria-label',`Farbe ${n}, ${remaining} Flächen übrig`);b.setAttribute('aria-pressed',selected===Number(n));b.innerHTML=`<span class="dot" style="background:${c}"></span><span>${n}</span><small>${remaining}</small>`;b.onclick=()=>{selected=Number(n);document.getElementById('message').textContent='';render()};pal.appendChild(b)});}
document.getElementById('undo').onclick=()=>{let i=history.pop();if(i===undefined){document.getElementById('message').textContent='Noch kein Schritt zum Rückgängigmachen.';return}completed.delete(i);save();render();document.getElementById('message').textContent='Letzte Fläche zurückgenommen.'};document.getElementById('reset').onclick=()=>{if(!confirm('Möchtest du das Bild wirklich neu beginnen?'))return;completed.clear();history=[];save();render();document.getElementById('message').textContent='Du kannst von vorne beginnen.'};render();
</script></body></html>
