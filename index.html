const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
const state={data:null,selected:null,done:new Set(),paths:new Map(),labels:new Map(),pan:false,scale:1,x:0,y:0,pointers:new Map(),gesture:null,dragged:false};
function svg(tag,attrs={}){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);return e}
function storageKey(){return `farbfreude:v1:${state.data.imageId}`}
function save(){try{localStorage.setItem(storageKey(),JSON.stringify([...state.done]))}catch(e){$('hint').textContent='Speichern ist in diesem Browser nicht verfügbar.'}}
function update(){const all=state.data.regions;const count=all.filter(r=>state.done.has(r.id)).length;const pct=Math.round(count/all.length*100);$('percent').textContent=pct+' %';$('progress').style.width=pct+'%';$('status').textContent=`${count} von ${all.length} Flächen ausgemalt`;
 for(const r of all){const p=state.paths.get(r.id),n=state.labels.get(r.id),done=state.done.has(r.id);p.classList.toggle('done',done);p.classList.toggle('target',!done&&r.colorId===state.selected);p.style.fill=done?state.data.palette.find(c=>c.id===r.colorId).color:'';n.style.display=done?'none':''}
 $('palette').replaceChildren(...state.data.palette.map(c=>{const remaining=all.filter(r=>r.colorId===c.id&&!state.done.has(r.id)).length;const b=document.createElement('button');b.className='swatch'+(state.selected===c.id?' selected':'')+(remaining===0?' complete':'');b.style.background=c.color;b.innerHTML=`<span>${remaining===0?'✓':c.id}</span><small>${remaining} offen</small>`;b.setAttribute('aria-label',`Farbe ${c.id}, ${remaining} Flächen offen`);b.onclick=()=>{state.selected=c.id;update()};return b}));
 if(count===all.length)$('hint').textContent='Geschafft! Dein Bild ist vollständig ausgemalt. 🎉';
}
function paint(id){if(state.pan||state.dragged)return;const r=state.data.regions.find(v=>v.id===id);if(!r||state.done.has(id))return;if(r.colorId!==state.selected){$('hint').textContent=`Diese Fläche gehört zu Farbe ${r.colorId}.`;return}state.done.add(id);save();update();$('hint').textContent='Gut gemacht! Weiter so.'}
function transform(){const g=$('scene');g.setAttribute('transform',`translate(${state.x} ${state.y}) scale(${state.scale})`)}
function fit(){state.scale=1;state.x=0;state.y=0;transform()}
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function coords(e){const rect=$('art').getBoundingClientRect();const vb=$('art').viewBox.baseVal;const ratio=Math.min(rect.width/vb.width,rect.height/vb.height);return{x:(e.clientX-rect.left-(rect.width-vb.width*ratio)/2)/ratio,y:(e.clientY-rect.top-(rect.height-vb.height*ratio)/2)/ratio}}
function installPointers(){const el=$('art');el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);state.pointers.set(e.pointerId,coords(e));state.dragged=false;if(state.pointers.size===2){const [a,b]=[...state.pointers.values()];state.gesture={dist:distance(a,b),scale:state.scale,x:state.x,y:state.y,mid:{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}}});
 el.addEventListener('pointermove',e=>{if(!state.pointers.has(e.pointerId))return;const old=state.pointers.get(e.pointerId),next=coords(e);state.pointers.set(e.pointerId,next);if(state.pointers.size===2){const [a,b]=[...state.pointers.values()];const mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};const g=state.gesture;if(!g)return;state.scale=Math.max(1,Math.min(8,g.scale*distance(a,b)/Math.max(1,g.dist)));state.x=mid.x-(g.mid.x-g.x)/g.scale*state.scale;state.y=mid.y-(g.mid.y-g.y)/g.scale*state.scale;state.dragged=true;transform()}else if(state.pan){if(distance(old,next)>0.5)state.dragged=true;state.x+=next.x-old.x;state.y+=next.y-old.y;transform()}});
 const finish=e=>{state.pointers.delete(e.pointerId);if(state.pointers.size<2)state.gesture=null};el.addEventListener('pointerup',finish);el.addEventListener('pointercancel',finish);
 el.addEventListener('wheel',e=>{e.preventDefault();const pt=coords(e),old=state.scale;state.scale=Math.max(1,Math.min(8,old*(e.deltaY<0?1.13:1/1.13)));state.x=pt.x-(pt.x-state.x)*state.scale/old;state.y=pt.y-(pt.y-state.y)*state.scale/old;transform()},{passive:false});
}
async function load(id){try{state.data=null;state.paths.clear();state.labels.clear();state.done.clear();state.selected=null;state.pan=false;state.pointers.clear();state.gesture=null;$('shapes').replaceChildren();$('numbers').replaceChildren();$('hint').textContent='Passende Flächen werden hervorgehoben.';fit();const [data,source]=await Promise.all([Promise.resolve(MOTIVES[id]?.data || Promise.reject(Error('Motivdaten fehlen'))),Promise.resolve(MOTIVES[id]?.svg || Promise.reject(Error('Motivgeometrie fehlt')))]);if(data.schemaVersion!==1)throw Error('Nicht unterstütztes Motivformat');state.data=data;const doc=new DOMParser().parseFromString(source,'image/svg+xml');if(doc.querySelector('parsererror'))throw Error('Ungültiges SVG');$('art').setAttribute('viewBox',`0 0 ${data.width} ${data.height}`);const fontSize=Math.max(10,Math.min(data.width,data.height)/47);
 for(const r of data.regions){const original=doc.getElementById(r.pathId);if(!original)throw Error(`Fehlender Pfad ${r.pathId}`);const p=svg('path',{d:original.getAttribute('d'),'fill-rule':'evenodd',class:'region','data-id':r.id});p.addEventListener('click',()=>paint(r.id));$('shapes').append(p);state.paths.set(r.id,p);const t=svg('text',{x:r.label[0],y:r.label[1],class:'number','font-size':fontSize});t.textContent=r.colorId;$('numbers').append(t);state.labels.set(r.id,t)}
 try{const saved=JSON.parse(localStorage.getItem(storageKey())||'[]');const valid=new Set(data.regions.map(r=>r.id));state.done=new Set(Array.isArray(saved)?saved.filter(id=>valid.has(id)):[])}catch{state.done=new Set()}
 state.selected=data.palette[0].id;update();}catch(e){$('status').textContent='Fehler beim Laden';$('hint').textContent=e.message+'';console.error(e)}}
installPointers();$('mode').onclick=()=>{state.pan=!state.pan;$('mode').setAttribute('aria-pressed',String(state.pan));$('mode').textContent='✋ Verschieben: '+(state.pan?'An':'Aus')};$('fit').onclick=fit;$('reset').onclick=()=>{if(!state.data)return;if(confirm('Gesamten Fortschritt für dieses Motiv löschen?')){state.done.clear();save();update()}};init();

const catalog=[{"id":"fox-001","title":"Fuchs im Wald","category":"Tiere"},{"id":"sunset-001","title":"Sonnenuntergang","category":"Natur"},{"id":"flower-001","title":"Blumenwiese","category":"Blumen"},{"id":"heart-001","title":"Herzchen","category":"Muster"},{"id":"sail-001","title":"Segelboot","category":"Natur"},{"id":"mountain-001","title":"Bergwelt","category":"Natur"}];
function showGallery(){ $('game').hidden=true;$('gallery').hidden=false;$('home').hidden=true;document.title='Farbfreude · Galerie';renderGallery();}
function openMotive(id){$('gallery').hidden=true;$('game').hidden=false;$('home').hidden=false;load(id);history.replaceState(null,'',location.pathname+location.search+'#'+encodeURIComponent(id));}
function renderGallery(){const cards=$('cards');cards.replaceChildren();for(const item of catalog){const b=document.createElement('button');b.className='motif';const thumb=document.createElement('div');thumb.className='thumb';thumb.textContent=({'fox-001':'🦊','sunset-001':'🌅','flower-001':'🌼','heart-001':'💗','sail-001':'⛵','mountain-001':'🏔️'})[item.id];const title=document.createElement('strong');title.textContent=item.title;const meta=document.createElement('span');meta.textContent=item.category;try{const done=JSON.parse(localStorage.getItem('farbfreude:v1:'+item.id)||'[]');if(Array.isArray(done)&&done.length)meta.textContent+=' · '+done.length+' Flächen fertig';}catch{}b.append(thumb,title,meta);b.onclick=()=>openMotive(item.id);cards.append(b)}}
function init(){$('home').onclick=()=>{history.replaceState(null,'',location.pathname+location.search);showGallery()};const id=decodeURIComponent(location.hash.slice(1));if(catalog.some(x=>x.id===id))openMotive(id);else showGallery()}
